<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UsamiOS — conceito visual v2 (protótipo de design)</title>
<meta name="description" content="Protótipo de design, não é a aplicação final. Conceito: o site como um computador com sistema próprio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Geist:wght@300..600&family=JetBrains+Mono:wght@400;500&family=Shippori+Mincho:wght@500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#05060c; --night:#0a1030; --night-2:#111a4a; --night-3:#1a2566;
  --pink:#ff8fc0; --pink-deep:#e8559a; --white:#f7f5fb; --mute:#9aa3c7; --dim:#5d6798;
  --line:rgba(247,245,251,.13); --line-2:rgba(247,245,251,.07);
  --serif:"Fraunces","Shippori Mincho",Georgia,serif;
  --sans:"Geist","Zen Kaku Gothic New",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);color:var(--white);font:15px/1.5 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--pink)}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}

/* ---------- desktop ---------- */
#desk{position:fixed;inset:0;background:radial-gradient(120% 90% at 78% 8%,var(--night-2) 0%,var(--night) 38%,var(--ink) 80%)}
#stars{position:absolute;inset:0;width:100%;height:100%}
.moon{position:absolute;right:7vw;top:12vh;width:min(34vw,420px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,143,192,.55);pointer-events:none}
.moon::before{content:"";position:absolute;inset:11%;border-radius:50%;border:1px solid rgba(255,143,192,.18)}
.moon::after{content:"";position:absolute;left:9%;top:44%;width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 18px 4px rgba(255,143,192,.55);animation:orbit 38s linear infinite;transform-origin:calc(min(34vw,420px)*.41) 0}
@keyframes orbit{to{transform:rotate(360deg)}}
.statement{position:absolute;left:clamp(20px,5vw,72px);bottom:calc(150px + env(safe-area-inset-bottom));max-width:min(760px,86vw);pointer-events:none}
.statement h1{font:300 clamp(34px,5.6vw,84px)/1.02 var(--serif);letter-spacing:-.02em;font-variation-settings:"opsz" 144}
.statement h1 em{font-style:italic;color:var(--pink)}
.statement p{margin-top:18px}
:lang(ja) .statement h1{font-family:var(--serif);letter-spacing:0;line-height:1.25}

/* ---------- menubar ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:36px;display:flex;align-items:center;gap:14px;padding:0 14px;z-index:900;background:rgba(5,6,12,.72);border-bottom:1px solid var(--line-2);backdrop-filter:blur(8px)}
#bar .brand{display:flex;align-items:center;gap:8px;font:500 14px var(--sans);letter-spacing:.02em}
#bar .grow{flex:1}
.langs{display:flex;gap:2px}
.langs button{padding:3px 8px;border-radius:5px;font:500 11px var(--mono);color:var(--mute)}
.langs button[aria-pressed=true]{color:var(--ink);background:var(--pink)}
.pill{padding:4px 10px;border:1px solid var(--line);border-radius:99px;font:500 11px var(--mono);color:var(--mute)}
.pill:hover{color:var(--white);border-color:var(--pink)}
#clock{font:400 12px var(--mono);color:var(--mute);min-width:44px;text-align:right}

/* ---------- prompt + dock ---------- */
#ask-bar{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(560px,calc(100vw - 32px));z-index:800;display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(10,16,48,.82);backdrop-filter:blur(10px);text-align:left;transition:border-color .2s var(--ease)}
#ask-bar:hover{border-color:var(--pink)}
#ask-bar span{color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ask-bar kbd{margin-left:auto;font:400 11px var(--mono);color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
#dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:8px;z-index:800;border:1px solid var(--line);border-radius:18px;background:rgba(5,6,12,.78);backdrop-filter:blur(10px)}
#dock button{display:grid;justify-items:center;gap:3px;width:64px;padding:8px 0 6px;border-radius:12px;transition:background .2s var(--ease),transform .2s var(--ease)}
#dock button:hover{background:var(--night-2)}
#dock button:active{transform:scale(.96)}
#dock svg{width:24px;height:24px;stroke:var(--white);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dock button.on svg{stroke:var(--pink)}
#dock small{font:500 9.5px var(--mono);letter-spacing:.06em;color:var(--mute);text-transform:uppercase}

/* ---------- windows ---------- */
.win{position:absolute;display:flex;flex-direction:column;background:var(--night);border:1px solid var(--line);border-radius:12px;box-shadow:0 40px 90px -20px rgba(0,0,0,.8);overflow:hidden;animation:pop .28s var(--ease);min-width:300px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}}
.win .tb{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px 0 14px;border-bottom:1px solid var(--line-2);background:rgba(5,6,12,.5);cursor:grab;touch-action:none;user-select:none}
.win .tb:active{cursor:grabbing}
.win .tb .t{flex:1;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.win .tb .x{width:26px;height:26px;border-radius:7px;color:var(--mute);font-size:18px;line-height:1}
.win .tb .x:hover{background:var(--pink);color:var(--ink)}
.win .bd{flex:1;min-height:0;overflow:auto}
.win.front{border-color:rgba(255,143,192,.35)}

/* files */
.files{display:grid;grid-template-columns:150px minmax(180px,1fr) minmax(260px,1.25fr);height:100%}
.files nav{border-right:1px solid var(--line-2);padding:12px 8px;display:grid;align-content:start;gap:2px}
.files nav button{text-align:left;padding:7px 10px;border-radius:7px;color:var(--mute);font-size:14px}
.files nav button[aria-current=true]{background:var(--night-2);color:var(--white)}
.files nav .mono{padding:2px 10px 8px}
.files .list{border-right:1px solid var(--line-2);padding:10px;display:grid;align-content:start;gap:4px}
.files .list button{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;text-align:left;padding:9px 10px;border-radius:9px}
.files .list button:hover{background:rgba(26,37,102,.45)}
.files .list button[aria-current=true]{background:var(--night-3)}
.files .list svg{width:22px;height:22px;stroke:var(--pink);fill:none;stroke-width:1.5}
.files .list b{font-weight:500;font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .list small{font:400 10.5px var(--mono);color:var(--dim)}
.prev{padding:20px 22px 28px;overflow:auto}
.prev h2{font:400 30px/1.1 var(--serif);letter-spacing:-.01em;margin:6px 0 10px}
.prev p{color:#d9dcf0}
.badge{display:inline-block;margin-right:6px;padding:2px 8px;border:1px solid var(--line);border-radius:99px;font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.badge.live{border-color:var(--pink);color:var(--pink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.chips span{padding:2px 8px;border-radius:5px;background:var(--night-2);font:400 11px var(--mono);color:#c9cdea}
.cols{display:grid;gap:18px;margin-top:6px}
.prev h3{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--pink);margin-bottom:8px}
.prev h3.plan{color:var(--mute)}
.prev ul{list-style:none;padding:0;display:grid;gap:7px}
.prev li{padding-left:16px;position:relative;font-size:13.5px;color:#dfe2f4}
.prev li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:1px;background:var(--pink)}
.prev ul.plan li{color:var(--mute)}
.prev ul.plan li::before{background:var(--dim)}
.prev .src{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
.prev .src a{font:400 12px var(--mono);text-decoration:none;border-bottom:1px solid rgba(255,143,192,.4)}
.note{margin-top:14px;font:400 11px var(--mono);color:var(--dim)}

/* terminal */
.term{height:100%;background:var(--ink);padding:14px 16px;font:400 13px/1.55 var(--mono);overflow:auto}
.term .out{white-space:pre-wrap;word-break:break-word;color:#cfd3ee}
.term .pk{color:var(--pink)}
.term .row{display:flex;gap:8px;align-items:baseline}
.term input{flex:1;background:none;border:0;outline:0;color:var(--white);font:inherit;caret-color:var(--pink)}
.term .dim{color:var(--dim)}

/* browser */
.brw{display:grid;grid-template-rows:auto 1fr;height:100%}
.brw .addr{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line-2)}
.brw .addr .u{flex:1;padding:6px 12px;border-radius:99px;background:var(--ink);font:400 12px var(--mono);color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brw .addr button{padding:5px 10px;border-radius:7px;font:500 11px var(--mono);color:var(--mute)}
.brw .addr button[aria-current=true]{background:var(--night-3);color:var(--white)}
.page{padding:28px clamp(18px,4vw,44px) 40px;overflow:auto}
.page h2{font:300 clamp(28px,3.4vw,42px)/1.08 var(--serif);letter-spacing:-.015em;margin:8px 0 14px}
.page h2 em{color:var(--pink)}
.page p{max-width:60ch;color:#d9dcf0;margin-bottom:12px}
.pil{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2);margin-top:22px}
.pil div{background:var(--night);padding:16px}
.pil b{display:block;font:400 18px var(--serif);margin-bottom:4px}
.pil span{font-size:13px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
th{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:top;color:#dfe2f4}
td a{font:400 12px var(--mono)}

/* agent */
.agent{display:grid;grid-template-rows:auto 1fr auto;height:100%}
.msgs{padding:16px;overflow:auto;display:grid;align-content:start;gap:12px}
.m{max-width:92%;padding:10px 13px;border-radius:12px;font-size:14px}
.m.u{justify-self:end;background:var(--night-3)}
.m.a{background:rgba(5,6,12,.6);border:1px solid var(--line-2)}
.m .cite{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.m .cite a{font:400 10.5px var(--mono);padding:2px 7px;border:1px solid var(--line);border-radius:5px;text-decoration:none}
.m .cite a:hover{border-color:var(--pink)}
.sug{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.sug button{padding:5px 11px;border:1px solid var(--line);border-radius:99px;font-size:12.5px;color:var(--mute)}
.sug button:hover{color:var(--white);border-color:var(--pink)}
.agent form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line-2)}
.agent input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--white);font:inherit}
.agent form button{padding:0 14px;border-radius:10px;background:var(--pink);color:var(--ink);font-weight:500}
.dots i{display:inline-block;width:5px;height:5px;margin-right:3px;border-radius:50%;background:var(--pink);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.25}}

/* boot / classic */
#boot{position:fixed;inset:0;z-index:2000;background:var(--ink);display:grid;place-content:center;gap:18px;justify-items:center;cursor:pointer;transition:opacity .6s var(--ease)}
#boot.off{opacity:0;pointer-events:none}
#boot pre{font:400 12px/1.8 var(--mono);color:var(--mute);min-height:6.4em}
#boot .word{font:300 44px var(--serif);letter-spacing:-.02em}
#classic{position:fixed;inset:36px 0 0;z-index:850;background:var(--ink);overflow:auto;padding:40px clamp(18px,8vw,120px) 80px}
#classic[hidden]{display:none}
#classic h1{font:300 clamp(34px,5vw,64px)/1.05 var(--serif);margin:10px 0 18px}
#classic h2{font:400 28px var(--serif);margin:36px 0 8px;color:var(--pink)}
#classic p,#classic li{max-width:68ch;color:#d9dcf0;margin-bottom:8px}
#classic ul{padding-left:18px}

.proto{position:fixed;left:14px;top:46px;z-index:850;max-width:240px;font:400 10.5px/1.5 var(--mono);color:var(--dim);pointer-events:none}

/* ---------- light theme ("dia") ---------- */
:root[data-theme=light]{
  color-scheme:light;
  --ink:#fbeaf3; --night:#fffafd; --night-2:#fbe4f0; --night-3:#f6cfe4;
  --pink:#c92f78; --pink-deep:#a82263; --white:#1b1f4a; --mute:#5f648f; --dim:#82869f;
  --line:rgba(27,31,74,.16); --line-2:rgba(27,31,74,.08);
}
[data-theme=light] #desk{background:radial-gradient(90% 60% at 80% 0%,#fff1f8 0%,transparent 60%),linear-gradient(180deg,#cfe2ff 0%,#e4dcff 48%,#ffe2ef 100%)}
[data-theme=light] .moon{border-color:rgba(201,47,120,.5)}
[data-theme=light] .moon::before{border-color:rgba(201,47,120,.2)}
[data-theme=light] .moon::after{background:#c92f78;box-shadow:0 0 18px 4px rgba(201,47,120,.35)}
[data-theme=light] #bar{background:rgba(255,250,253,.72)}
[data-theme=light] #dock,[data-theme=light] #ask-bar{background:rgba(255,250,253,.82)}
[data-theme=light] .win{box-shadow:0 30px 70px -24px rgba(60,40,120,.35)}
[data-theme=light] .win .tb{background:rgba(251,228,240,.55)}
[data-theme=light] .m.a{background:rgba(255,255,255,.75)}
[data-theme=light] .files .list button:hover{background:rgba(246,207,228,.45)}
[data-theme=light] .prev p,[data-theme=light] .prev li,[data-theme=light] .page p,[data-theme=light] td,[data-theme=light] #classic p,[data-theme=light] #classic li{color:#2c3060}
[data-theme=light] .prev ul.plan li,[data-theme=light] .prev ul.plan{color:var(--mute)}
[data-theme=light] .chips span{color:#4a4f86}
[data-theme=light] .term{background:#fff4f9}
[data-theme=light] .term .out{color:#2c3060}
[data-theme=light] .agent form button{background:var(--pink);color:#fff}
[data-theme=light] .win .tb .x:hover{color:#fff}
[data-theme=light] .langs button[aria-pressed=true]{color:#fff}
[data-theme=light] #classic{background:#fff4f9}
[data-theme=light] .statement h1{color:#1b1f4a}
.who{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.who i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px dashed var(--pink);color:var(--pink);font:500 14px var(--serif);font-style:normal}
.who span{font:500 11px var(--mono);letter-spacing:.06em;color:var(--mute)}
.themebtn{width:30px;height:26px;display:grid;place-items:center;border:1px solid var(--line);border-radius:99px;color:var(--mute)}
.themebtn:hover{color:var(--white);border-color:var(--pink)}
.themebtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}

@media (max-width:760px){
  .win{inset:36px 0 calc(150px + env(safe-area-inset-bottom)) 0 !important;width:auto !important;height:auto !important;border-radius:0}
  .win .tb{cursor:default}
  .files{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  .files nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line-2)}
  .files nav .mono{display:none}
  .files .list{border-right:0;border-bottom:1px solid var(--line-2);max-height:34vh;overflow:auto}
  .moon{width:70vw;right:-15vw;top:8vh}
  #dock button{width:54px}
  .langs button{padding:3px 5px}
  .proto,#bar .pill.hide-m{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>

<div id="boot" role="presentation" aria-hidden="true">
  <svg width="54" height="54" viewBox="0 0 54 54" fill="none" stroke="#ff8fc0" stroke-width="1.2"><circle cx="27" cy="27" r="22"/><circle cx="27" cy="27" r="14" opacity=".4"/><circle cx="14" cy="22" r="2.4" fill="#ff8fc0"/></svg>
  <div class="word">UsamiOS</div>
  <pre id="bootlog"></pre>
  <span class="mono" id="bootskip"></span>
</div>

<div id="desk">
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="moon" aria-hidden="true"></div>
  <div class="statement">
    <span class="mono" id="st-kicker"></span>
    <h1 id="st-h1"></h1>
    <p class="mono" id="st-p"></p>
  </div>
</div>

<header id="bar">
  <div class="brand">
    <svg width="18" height="18" viewBox="0 0 54 54" fill="none" stroke="#ff8fc0" stroke-width="3" aria-hidden="true"><circle cx="27" cy="27" r="22"/><circle cx="14" cy="22" r="4" fill="#ff8fc0"/></svg>
    <span>UsamiOS</span>
  </div>
  <div class="grow"></div>
  <button class="themebtn" id="themeBtn" aria-label="Theme" title="Theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <button class="pill hide-m" id="classicBtn" aria-pressed="false"></button>
  <div class="langs" role="group" aria-label="Language">
    <button data-l="pt" lang="pt">PT</button><button data-l="en" lang="en">EN</button><button data-l="es" lang="es">ES</button><button data-l="ja" lang="ja">日本語</button>
  </div>
  <time id="clock"></time>
</header>

<div class="proto" id="protoNote"></div>

<button id="ask-bar" aria-haspopup="dialog"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff8fc0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg><span id="ask-t"></span><kbd>/</kbd></button>

<nav id="dock" aria-label="Apps">
  <button data-app="files"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><small></small></button>
  <button data-app="term"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg><small></small></button>
  <button data-app="brw"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><small></small></button>
  <button data-app="agent"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg><small></small></button>
</nav>

<main id="classic" hidden></main>

<script>
/* ================= i18n (UI chrome) ================= */
const UI={
 pt:{files:"Arquivos",term:"Terminal",brw:"Navegador",agent:"Usami",
  kicker:"usami · empresa de tecnologia",h1:"IA que conversa, lembra e age — <em>e prova o que faz.</em>",
  sub:"Sistemas · Contribuições · Evidências",
  ask:"Pergunte sobre a empresa, os projetos ou o fundador…",classic:"Modo clássico",desktop:"Voltar ao desktop",
  proto:"Protótipo de design v1. Não é a aplicação final. Marca provisória.",
  sistemas:"Sistemas",contrib:"Contribuições",lab:"Laboratório",empresa:"Empresa",folders:"Pastas",
  proven:"Provado nos repositórios",planned:"Planejado — ainda não existe",evidence:"Evidências",stack:"Stack",
  tradNote:"Listas em inglês nesta língua — tradução em revisão.",

/* ---------- Terminal (simulated) ---------- */
function mountTerm(body){
  body.innerHTML='<div class="term"><div class="log"></div><div class="row"><span class="pk" id="ps"></span><input aria-label="Terminal" spellcheck="false" autocomplete="off"></div></div>';
  const term=$(".term",body),log=$(".log",body),inp=$("input",body),ps=$("#ps",body);
  let cwd="/",hist=[],hi=0;
  const prompt=()=>"usami:"+cwd+"$";
  const out=(s,c)=>{const d=mk("div","out"+(c?" "+c:""));d.textContent=s;log.appendChild(d);term.scrollTop=term.scrollHeight};
  const dirOf=p=>{if(!p||p==="/")return "/";p=p.replace(/\/$/,"").replace(/^\//,"");return FOLDERS.find(d=>d===p||d===p.replace("contribuicoes","contrib").replace("laboratorio","lab"))||null};
  function findFile(n){const here=cwd==="/"?null:cwd.slice(1);return FILES.find(f=>f.name===n.replace(/^\//,"").split("/").pop()&&(!here||f.dir===here||n.includes("/")))}
  function run(line){
    out(prompt()+" "+line,"dim");
    const [c,...a]=line.trim().split(/\s+/);const arg=a.join(" ");
    switch(c){
      case "":case undefined:break;
      case "help":out(t("termHelp"));break;
      case "pwd":out(cwd);break;
      case "whoami":out("visitor@usami — "+lang);break;
      case "clear":log.innerHTML="";break;
      case "ls":{ if(cwd==="/"&&!arg)out(FOLDERS.map(d=>d+"/").join("  "));
        else{const d=cwd==="/"?dirOf(arg):cwd.slice(1);if(!d||d==="/")out(FOLDERS.map(x=>x+"/").join("  "));else out(FILES.filter(f=>f.dir===d).map(f=>f.name).join("\n"))}break}
      case "cd":{const d=dirOf(arg);if(arg===".."||arg==="/"||!arg)cwd="/";else if(d&&d!=="/")cwd="/"+d;else out("cd: "+t("nf"));ps.textContent=prompt();refreshChrome();break}
      case "cat":{const f=findFile(arg);if(!f){out("cat: "+t("nf"));break}
        const L=lists(f);let s=f.name+"\n\n"+fileDesc(f);
        if(L.proven.length)s+="\n\n["+t("proven")+"]\n"+L.proven.map(x=>" + "+x).join("\n");
        if(L.planned.length)s+="\n\n["+t("planned")+"]\n"+L.planned.map(x=>" - "+x).join("\n");
        if(f.src.length)s+="\n\n["+t("evidence")+"]\n"+f.src.map(x=>" > "+x[1]).join("\n");
        out(s);break}
      case "open":{const f=findFile(arg);if(!f){out("open: "+t("nf"));break}openApp("files",f.id);out("→ "+f.name);break}
      case "evidence":openApp("brw","evid");out("→ usami://evidencias");break;
      case "lang":if(UI[arg]){setLang(arg);out("→ "+arg)}else out("lang <pt|en|es|ja>");break;
      case "ask":{const r=answer(arg);out(r.text);break}
      case "sudo":out(t("sudo"));break;
      default:out(c+": command not found — help");
    }
  }
  ps.textContent=prompt();
  out(t("termWelcome"),"dim");
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter"){const v=inp.value;if(v)hist.push(v);hi=hist.length;inp.value="";run(v)}
    else if(e.key==="ArrowUp"){hi=Math.max(0,hi-1);inp.value=hist[hi]||"";e.preventDefault()}
    else if(e.key==="ArrowDown"){hi=Math.min(hist.length,hi+1);inp.value=hist[hi]||"";e.preventDefault()}
  });
  body.addEventListener("click",()=>inp.focus());
  setTimeout(()=>inp.focus({preventScroll:true}),50);
  return {title:()=>t("term")+" — "+prompt(),refresh(){},go(){inp.focus()}};
}

/* ---------- Agent ---------- */
function answer(q){
  const hit=KB.find(e=>e.k.test(q));
  if(!hit)return {text:t("unknown"),src:[]};
  if(hit.id==="__planned"){
    const items=FILES.filter(f=>f.planned.en.length).flatMap(f=>(lang==="pt"?f.planned.pt:f.planned.en).slice(0,2).map(x=>f.name+": "+x));
    return {text:items.join(" · "),src:[["evidencias.ledger",null]]};
  }
  const f=hit.id==="company"?null:fileById(hit.id);
  return {text:f?fileDesc(f):pick(D.company),src:f?f.src:[]};
}

(function(){
  const c=$("#stars"),x=c.getContext("2d");let W,H,S=[],mx=0,my=0;
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  function size(){const r=devicePixelRatio||1;W=c.width=innerWidth*r;H=c.height=innerHeight*r;S=Array.from({length:Math.round(innerWidth*innerHeight/9000)},()=>({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.1+.3)*r,p:Math.random()*.9+.1,t:Math.random()*6}))}
  function draw(ts){
    x.clearRect(0,0,W,H);
    S.forEach(s=>{const a=reduce?.55:.35+.35*Math.sin(ts/1800+s.t);x.fillStyle="rgba("+(document.documentElement.dataset.theme==="light"?"201,47,120":"247,245,251")+","+a*s.p+")";x.beginPath();x.arc(s.x+mx*s.p*14,s.y+my*s.p*14,s.r,0,6.3);x.fill()});
    if(!reduce)requestAnimationFrame(draw);
  }
  addEventListener("resize",()=>{size();if(reduce)draw(0)});addEventListener("themechange",()=>{if(reduce)draw(0)});
  addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
  size();requestAnimationFrame(draw);
})();

/* ================= boot ================= */
(function(){
  const boot=$("#boot"),log=$("#bootlog");
  setLang("pt");
  $("#bootskip").textContent=t("bootSkip");
  const lines=t("bootLines");let i=0,done=false;
  const end=()=>{if(done)return;done=true;boot.classList.add("off");setTimeout(()=>boot.remove(),700);
    const p=new URLSearchParams(location.search).get("open");
    if(p)p.split(",").forEach(a=>APPS[a]&&openApp(a));
    else openApp("files");};
  boot.addEventListener("click",end);addEventListener("keydown",end,{once:true});
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){end();return}
  const step=()=>{if(done)return;if(i<lines.length){log.textContent+=lines[i++]+"\n";setTimeout(step,420)}else setTimeout(end,500)};
  step();
})();
</script>
